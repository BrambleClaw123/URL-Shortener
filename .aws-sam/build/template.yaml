AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: URL Shortener Serverless - HCMUTE Cloud Project
Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    Runtime: python3.12
    ReservedConcurrentExecutions: 5
    Environment:
      Variables:
        TABLE_NAME:
          Ref: UrlShortenerTable
  Api:
    Cors:
      AllowMethods: '''GET,POST,OPTIONS'''
      AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
      AllowOrigin: '''*'''
Resources:
  UrlShortenerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UrlShortenerTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: short_id
        AttributeType: S
      KeySchema:
      - AttributeName: short_id
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl_expire
        Enabled: true
  CreateLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CreateLinkFunction
      Handler: create.handler
      Role:
        Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        CreateApi:
          Type: Api
          Properties:
            Path: /links
            Method: post
    Metadata:
      SamResourceId: CreateLinkFunction
  RedirectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: RedirectFunction
      Handler: redirect.handler
      Role:
        Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        RedirectApi:
          Type: Api
          Properties:
            Path: /{short_id}
            Method: get
    Metadata:
      SamResourceId: RedirectFunction
  GetStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetStatsFunction
      Handler: stats.handler
      Role:
        Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        StatsApi:
          Type: Api
          Properties:
            Path: /{short_id}/stats
            Method: get
    Metadata:
      SamResourceId: GetStatsFunction
Outputs:
  ApiEndpoint:
    Description: "URL g\u1ED1c c\u1EE7a API Gateway (Copy link n\xE0y d\xE1n v\xE0\
      o Frontend)"
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: URL Shortener Serverless - HCMUTE Cloud Project
Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    Runtime: python3.12
    ReservedConcurrentExecutions: 5
    Environment:
      Variables:
        TABLE_NAME:
          Ref: UrlShortenerTable
  Api:
    Cors:
      AllowMethods: '''GET,POST,OPTIONS'''
      AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
      AllowOrigin: '''*'''
Resources:
  UrlShortenerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UrlShortenerTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: short_id
        AttributeType: S
      KeySchema:
      - AttributeName: short_id
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl_expire
        Enabled: true
      Tags:
      - Key: Project
        Value: URLShortener
      - Key: Owner
        Value: 2411023724110169
  CreateLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: CreateLinkFunction
      Handler: create.handler
      Role:
        Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        CreateApi:
          Type: Api
          Properties:
            Path: /links
            Method: post
    Metadata:
      SamResourceId: CreateLinkFunction
  RedirectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: RedirectFunction
      Handler: redirect.handler
      Role:
        Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        RedirectApi:
          Type: Api
          Properties:
            Path: /{short_id}
            Method: get
    Metadata:
      SamResourceId: RedirectFunction
  GetStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetStatsFunction
      Handler: stats.handler
      Role:
        Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        StatsApi:
          Type: Api
          Properties:
            Path: /{short_id}/stats
            Method: get
    Metadata:
      SamResourceId: GetStatsFunction
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: url-shortener-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
      Tags:
      - Key: Project
        Value: URLShortener
      - Key: Owner
        Value: 2411023724110169
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: PublicReadGetObject
          Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource:
            Fn::Sub: arn:aws:s3:::${FrontendBucket}/*
Outputs:
  ApiEndpoint:
    Description: URL API Gateway
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  WebsiteURL:
    Description: URL S3 Frontend
    Value:
      Fn::GetAtt:
      - FrontendBucket
      - WebsiteURL
